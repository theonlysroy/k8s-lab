apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: api
    env: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
      env: dev
  template:
    metadata:
      labels:
        app: api
        env: dev
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
